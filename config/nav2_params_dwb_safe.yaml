amcl:
  ros__parameters:
    alpha1: 0.001
    alpha2: 0.01
    alpha3: 0.01
    alpha4: 0.01
    alpha5: 0.02
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 3.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    scan_topic: scan
    set_initial_pose: true
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.1
    use_sim_time: false
    z_hit: 0.9
    z_rand: 0.5
    z_short: 0.05

bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    # To enable the custom blocked-path/recovery tree, copy
    # behavior_trees/score_replanning_recovery.xml into the Storagy package and
    # set default_nav_to_pose_bt_xml to its absolute path.
    default_server_timeout: 20
    enable_groot_monitoring: true
    global_frame: map
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    odom_topic: /odom
    robot_base_frame: base_link
    use_sim_time: false
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_controller_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    controller_plugins:
      - FollowPath
      - PurePursuit
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
      - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 6.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # Default controller in the Storagy BT. RotationShim aligns the robot first,
    # then DWB chooses the lowest-scoring sampled trajectory.
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: dwb_core::DWBLocalPlanner

      # Rotation shim: slower and smoother than the original high-spin profile.
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.7
      rotate_to_heading_angular_vel: 1.2
      max_angular_accel: 3.0
      simulate_ahead_time: 3.0

      # DWB motion sampling. This is intentionally safer and smoother than the
      # original 0.6 m/s profile for first score/energy-based tests.
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.3
      max_vel_y: 0.0
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.3
      min_speed_theta: 0.0
      acc_lim_x: 0.8
      acc_lim_y: 0.0
      acc_lim_theta: 0.8
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -1.2
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 32
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.12
      trans_stopped_velocity: 0.10
      short_circuit_trajectory_evaluation: true
      stateful: true

      # Score terms:
      # - safety: BaseObstacle, ObstacleFootprint
      # - distance/time: PathDist, GoalDist, PathAlign, GoalAlign
      # - energy/smoothness: RotateToGoal, PreferForward, Twirling
      critics:
        - BaseObstacle
        - ObstacleFootprint
        - RotateToGoal
        - Oscillation
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
        - PreferForward
        - Twirling
      BaseObstacle.scale: 0.25
      ObstacleFootprint.scale: 0.02
      GoalAlign.forward_point_distance: 0.1
      GoalAlign.scale: 20.0
      GoalDist.scale: 24.0
      PathAlign.forward_point_distance: 0.1
      PathAlign.scale: 24.0
      PathDist.scale: 32.0
      PreferForward.scale: 6.0
      RotateToGoal.lookahead_time: -1.0
      RotateToGoal.scale: 28.0
      RotateToGoal.slowing_factor: 5.0
      Twirling.scale: 6.0

    # Kept for controller selector experiments. It is also made cost-aware.
    PurePursuit:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      allow_reversing: false
      angular_dist_threshold: 0.785
      desired_linear_vel: 0.35
      forward_sampling_distance: 0.5
      lookahead_dist: 0.6
      lookahead_time: 1.5
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_angular_accel: 1.6
      max_lookahead_dist: 1.5
      max_robot_pose_search_dist: 10.0
      min_approach_linear_velocity: 0.05
      min_lookahead_dist: 0.3
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.20
      rotate_to_heading_angular_vel: 0.7
      rotate_to_heading_min_angle: 0.785
      simulate_ahead_time: 3.0
      transform_tolerance: 0.3
      use_cost_regulated_linear_velocity_scaling: true
      use_interpolation: false
      use_regulated_linear_velocity_scaling: true
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: false

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      always_send_full_costmap: true
      footprint: "[[0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25]]"
      footprint_padding: 0.10
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      update_frequency: 2.0
      publish_frequency: 2.0
      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_min_range: 0.0
          obstacle_max_range: 3.0
          raytrace_min_range: 0.0
          raytrace_max_range: 20.0

      # Original radius was already wide. Lower scaling factor spreads the
      # penalty more gently, making "near obstacle" cells stay expensive.
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.5
        cost_scaling_factor: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      always_send_full_costmap: true
      footprint: "[[0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25]]"
      footprint_padding: 0.10
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 3
      resolution: 0.05
      update_frequency: 8.0
      publish_frequency: 4.0
      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_min_range: 0.0
          obstacle_max_range: 3.0
          raytrace_min_range: 0.0
          raytrace_max_range: 20.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.2
        cost_scaling_factor: 2.0

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins:
      - GridBased

    # SmacPlanner2D uses costmap cost during search. This makes the global path
    # prefer lower-risk cells instead of simply following the shortest path.
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.5
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.3, 0.0, 0.8]
    min_velocity: [0.0, 0.0, -0.8]
    max_accel: [0.8, 0.0, 0.8]
    max_decel: [-1.0, 0.0, -1.2]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 2000
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
